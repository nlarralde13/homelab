modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
  http_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
  http_2xx_insecure_gluetun:
    prober: http
    timeout: 5s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      basic_auth:
        username: prometheus
        password_file: /etc/blackbox_exporter/secrets/gluetun-password
      tls_config:
        insecure_skip_verify: true

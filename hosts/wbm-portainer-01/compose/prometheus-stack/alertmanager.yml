global:
  resolve_timeout: 5m

route:
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: cerebro

receivers:
  - name: cerebro
    webhook_configs:
      - url: http://192.168.1.222:8790/api/v1/ingest/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/cerebro-secret

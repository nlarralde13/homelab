---
- Core Infrastructure:
    - Proxmox 1:
        icon: proxmox.png
        href: https://192.168.1.4:8006/
        description: Primary virtualization host
        siteMonitor: https://192.168.1.4:8006/
        widget:
          type: proxmox
          url: https://192.168.1.4:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_1_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_1_PASSWORD}}"
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

